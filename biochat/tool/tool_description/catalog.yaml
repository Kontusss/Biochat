    name: model_folder
    type: str
- description: Convert ENSEMBL gene IDs between different species using BioMart homology
    mapping. This function converts a list of ENSEMBL gene IDs from one species to
    their homologous counterparts in another species using the Ensembl BioMart database.
    The conversion is based on one-to-one ortholog mappings between species.
