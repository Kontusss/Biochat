  required_parameters:
  - default: null
    description: Most important keyword or phrase to search (title, description, authors)
    name: query
    type: str
- description: Retrieve detailed metadata for a specific protocols.io protocol by
    ID.
  name: get_protocol_details
  optional_parameters:
  - default: 30
    description: Request timeout in seconds
    name: timeout
    type: int
  required_parameters:
  - default: null
    description: Numeric protocol ID from protocols.io
    name: protocol_id
    type: int
- description: List available protocol files in the local biochat/tool/protocols/ directory.
    Includes protocols from Addgene and Thermo Fisher Scientific.
  name: list_local_protocols
  optional_parameters:
  - default: null
    description: Filter by source directory (e.g., 'addgene' or 'thermofisher'). If
      None, lists all protocols.
    name: source
    type: str
  required_parameters: []
- description: Read the contents of a local protocol file from biochat/tool/protocols/.
    Use list_local_protocols() first to find available protocol filenames.
  name: read_local_protocol
  optional_parameters:
  - default: null
    description: Source directory (e.g., 'addgene' or 'thermofisher'). If None, searches
      all sources.
    name: source
    type: str
  required_parameters:
  - default: null
    description: Name of the protocol file (e.g., 'Addgene_ Protocol - How to Run
      an Agarose Gel.txt')
    name: filename
    type: str
antibody_design:
- name: design_vh_only_antibodies
  description: 'Design VH-only antibody CDRH3 candidates targeting a short peptide
    epitope (≤24 amino acids). Uses computational filtering and scoring (NOT LLM heuristics).
    Returns ranked candidates with provenance-tracked scores. IMPORTANT: Use this
    tool for antibody/CDR/nanobody design tasks instead of inventing sequences from
    training data.'
  required_parameters:
  - name: epitope_sequence
    type: str
    description: Target epitope amino acid sequence, e.g. 'PSAEVWD'
  - name: num_candidates
    type: int
    description: Number of candidates to return (1-20, default 5)
  optional_parameters:
  - name: mode
    type: str
    description: '''sequence_only'' (default). ''full_pipeline'' not yet available.'
    default: sequence_only
- name: score_and_rank_candidates
  description: Validate, score, and rank a list of CDRH3 candidates against an epitope.
    Runs generation_filter → developability_checks → charge_complementarity → sequence_qc
    → ranking. All scores carry provenance metadata.
  required_parameters:
  - name: cdrh3_sequences
    type: List[str]
    description: List of CDRH3 amino acid sequences to evaluate
  - name: epitope_sequence
    type: str
    description: Target epitope sequence
  optional_parameters:
  - name: full_sequences
    type: List[str]
    description: Optional full VH sequences for developability checks
    default: null
