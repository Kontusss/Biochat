- description: Generate average protein embeddings for a list of Ensembl gene IDs
    using ESM (Evolutionary Scale Modeling) protein language models. This function
    fetches all protein isoform sequences for each gene, computes embeddings for each
    isoform using the specified ESM model and layer, then averages the embeddings
    across all isoforms to create a single representative embedding per gene. The
    embeddings are saved as PyTorch tensors for future use. Memory-friendly implementation
    with rolling averages, small batch processing, and automatic memory management.
    Automatically handles GPU/CPU device selection and includes error recovery for
    out-of-memory situations by falling back to single-sequence processing.
  name: generate_gene_embeddings_with_ESM_models
  optional_parameters:
  - default: esm2_t6_8M_UR50D
    description: ESM model name to use for generating embeddings
    name: model_name
    type: str
  - default: 6
    description: Which layer of the ESM model to extract embeddings from, generally
      use last layer
    name: layer
    type: int
  - default: null
    description: Optional path to save embeddings as PyTorch dictionary
    name: save_path
    type: str
  - default: 1
    description: Number of sequences to process at once to manage memory usage
    name: batch_size
    type: int
  - default: 1024
    description: Maximum sequence length to process, longer sequences are filtered
      out
    name: max_sequence_length
    type: int
  required_parameters:
  - default: null
    description: List of Ensembl gene IDs (e.g., ['ENSG00000012048', 'ENSG00000012049'])
    name: ensembl_gene_ids
    type: List[str]
- description: Generate Transcriptformer embeddings for single-cell RNA-seq data.
    This function downloads model checkpoints, prepares the AnnData object with required
    fields (ensembl_id, raw counts, assay metadata), and runs inference to generate
    cell or gene embeddings. Transcriptformer is a transformer-based model that can
    learn rich representations of single-cell gene expression data. The function automatically
    handles Ensembl ID pattern detection, model downloading, data preprocessing, and
    creates missing assay metadata columns with 'unknown' values if needed.
  name: generate_transcriptformer_embeddings
  optional_parameters:
  - default: null
    description: Name of the output embeddings file. If None, will use input filename
      with '_transcriptformer_embeddings' suffix
    name: output_filename
    type: str
  - default: tf-sapiens
    description: 'Type of transcriptformer model to download and use. Options: ''tf-sapiens'',
      ''tf-exemplar'', ''tf-metazoa'''
