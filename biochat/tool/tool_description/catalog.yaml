literature:
- description: Fetches supplementary information for a paper given its DOI and saves
    it to a specified directory.
  name: fetch_supplementary_info_from_doi
  optional_parameters:
  - default: supplementary_info
    description: Directory to save supplementary files
    name: output_dir
    type: str
  required_parameters:
  - default: null
    description: The paper DOI
    name: doi
    type: str
- description: Query arXiv for papers based on the provided search query.
  name: query_arxiv
  optional_parameters:
  - default: 10
    description: The maximum number of papers to retrieve.
    name: max_papers
    type: int
  required_parameters:
  - default: null
    description: The search query string.
    name: query
    type: str
- description: Query Google Scholar for papers based on the provided search query
    and return the first search result.
  name: query_scholar
  optional_parameters: []
  required_parameters:
  - default: null
    description: The search query string.
    name: query
    type: str
- description: Query PubMed for papers based on the provided search query.
  name: query_pubmed
  optional_parameters:
  - default: 10
    description: The maximum number of papers to retrieve.
    name: max_papers
    type: int
  - default: 3
    description: Maximum number of retry attempts with modified queries.
    name: max_retries
    type: int
  required_parameters:
  - default: null
    description: The search query string.
    name: query
    type: str
- description: Search using Google search and return formatted results.
  name: search_google
  optional_parameters:
  - default: 3
    description: Number of results to return
    name: num_results
    type: int
  - default: en
    description: Language code for search results
    name: language
    type: str
  required_parameters:
  - default: null
    description: The search query (e.g., "protocol text or search question")
    name: query
    type: str
- description: Extract the text content of a webpage using requests and BeautifulSoup.
  name: extract_url_content
  optional_parameters: []
  required_parameters:
  - default: null
    description: Webpage URL to extract content from
    name: url
    type: str
- description: Extract text content from a PDF file.
  name: extract_pdf_content
  optional_parameters: []
  required_parameters:
  - default: null
    description: URL of the PDF file
    name: url
    type: str
- description: Initiate an advanced web search by launching a specialized agent to
    collect relevant information and citations through multiple rounds of web searches
    for a given query.
  name: advanced_web_search_claude
  optional_parameters:
  - default: 1
    description: Maximum number of searches
    name: max_searches
    type: int
  - default: 3
    description: Maximum number of retry attempts with modified queries.
    name: max_retries
    type: int
  required_parameters:
  - default: null
    description: The search query string.
    name: query
    type: str
biochemistry:
- description: Analyzes circular dichroism (CD) spectroscopy data to determine secondary
    structure and thermal stability.
  name: analyze_circular_dichroism_spectra
  optional_parameters:
  - default: null
    description: Temperature values (°C) for thermal denaturation experiment
    name: temperature_data
    type: list or numpy.ndarray
  - default: null
    description: CD signal values at specific wavelength across different temperatures
    name: thermal_cd_data
    type: list or numpy.ndarray
  - default: ./
    description: Directory to save result files
    name: output_dir
    type: str
  required_parameters:
  - default: null
    description: Name of the biomolecule sample (e.g., "Znf706", "G-quadruplex")
    name: sample_name
    type: str
  - default: null
    description: Type of biomolecule ("protein" or "nucleic_acid")
    name: sample_type
    type: str
  - default: null
    description: Wavelength values in nm for CD spectrum
    name: wavelength_data
    type: list or numpy.ndarray
  - default: null
    description: CD signal intensity values (typically in mdeg or Δε)
    name: cd_signal_data
    type: list or numpy.ndarray
- description: Calculate numeric values for various structural features of an RNA
    secondary structure.
  name: analyze_rna_secondary_structure_features
  optional_parameters:
  - default: null
    description: The RNA sequence corresponding to the structure. If provided, sequence-dependent
      energy calculations will be performed.
    name: sequence
    type: str
  required_parameters:
  - default: null
    description: RNA secondary structure in dot-bracket notation (e.g., "(((...)))").
      Parentheses represent base pairs, dots represent unpaired bases.
    name: dot_bracket_structure
    type: str
- description: Analyze protease kinetics data from fluorogenic peptide cleavage assays,
    fit the data to Michaelis-Menten kinetics, and determine key kinetic parameters.
  name: analyze_protease_kinetics
  optional_parameters:
  - default: protease_kinetics
    description: Prefix for output files
    name: output_prefix
    type: str
  - default: ./
    description: Directory to save output files
    name: output_dir
    type: str
  required_parameters:
  - default: null
    description: Array of time points (in seconds) at which measurements were taken
    name: time_points
    type: numpy.ndarray
  - default: null
    description: 2D array of fluorescence measurements where each row corresponds
      to a different substrate concentration and each column corresponds to a time
      point
    name: fluorescence_data
    type: numpy.ndarray
  - default: null
    description: Array of substrate concentrations (in μM) corresponding to each row
      in fluorescence_data
    name: substrate_concentrations
    type: numpy.ndarray
  - default: null
    description: Concentration of the protease enzyme (in μM)
    name: enzyme_concentration
    type: float
- description: Performs in vitro enzyme kinetics assay and analyzes the dose-dependent
    effects of modulators.
  name: analyze_enzyme_kinetics_assay
  optional_parameters:
  - default: null
    description: Dictionary of modulators where keys are modulator names and values
      are lists of concentrations in μM
    name: modulators
    type: dict
  - default: null
    description: Time points in minutes for time-course measurements
    name: time_points
    type: list or numpy.ndarray
  - default: ./
    description: Directory to save output files
    name: output_dir
    type: str
  required_parameters:
  - default: null
    description: Name of the purified enzyme being tested
    name: enzyme_name
    type: str
  - default: null
    description: List of substrate concentrations in μM for kinetic analysis
    name: substrate_concentrations
    type: list or numpy.ndarray
  - default: null
    description: Concentration of the enzyme in nM
    name: enzyme_concentration
    type: float
- description: Analyzes isothermal titration calorimetry (ITC) data to determine binding
    affinity and thermodynamic parameters.
  name: analyze_itc_binding_thermodynamics
  optional_parameters:
  - default: null
    description: Path to CSV or TSV file containing ITC thermogram data with columns
      for injection number, injection volume, and heat released/absorbed.
    name: itc_data_path
    type: str
  - default: null
    description: Raw ITC thermogram data as a numpy array with shape (n_injections,
      3) containing injection number, injection volume, and heat.
    name: itc_data
    type: numpy.ndarray
  - default: 298.15
    description: Temperature in Kelvin at which the experiment was conducted.
    name: temperature
    type: float
  - default: null
    description: Initial concentration of protein in the cell in molar (M).
    name: protein_concentration
    type: float
  - default: null
    description: Concentration of ligand in the syringe in molar (M).
    name: ligand_concentration
    type: float
  required_parameters: []
- description: Perform multiple sequence alignment and phylogenetic analysis to identify
    conserved protein regions.
  name: analyze_protein_conservation
  optional_parameters:
  - default: ./
    description: Directory to save output files
    name: output_dir
    type: str
  required_parameters:
  - default: null
    description: List of protein sequences in FASTA format from multiple organisms.
    name: protein_sequences
    type: list of str
bioimaging:
- description: Split a 4D NIfTI file into separate modality files for nnUNet processing.
    Handles BRATS dataset format with FLAIR, T1w, t1gd, and T2w modalities.
  name: split_modalities
  optional_parameters:
  - default: BRAT
    description: Base name for the case files
    name: case_name
    type: str
  required_parameters:
  - default: null
    description: Path to the 4D NIfTI file to split
    name: input_file
    type: str
  - default: null
    description: Directory to save the split modality files
    name: output_dir
    type: str
- description: Prepare input data for nnUNet by handling both 4D and pre-split modality
    files. Automatically detects file format and prepares data accordingly.
  name: prepare_input_for_nnunet
  optional_parameters:
  - default: BRAT
    description: Base name for the case files
    name: case_name
    type: str
  required_parameters:
  - default: null
    description: Path to input file or directory
    name: input_path
    type: str
  - default: null
    description: Directory to save prepared files
    name: output_dir
    type: str
- description: Segment images using nnUNet with proper environment setup. Supports
    brain tumor segmentation and other medical image segmentation tasks.
  name: segment_with_nn_unet
  optional_parameters:
  - default: 3d_fullres
    description: Model type for segmentation
    name: model_type
    type: str
  - default:
    - 0
    - 1
    - 2
    - 3
    - 4
    description: Model folds to use for ensemble prediction
    name: folds
    type: list
  - default: false
    description: Use test time augmentation
    name: use_tta
    type: bool
  - default: 1
    description: Number of threads for preprocessing
    name: num_threads
    type: int
  - default: true
    description: Use mixed precision for faster inference
    name: mixed_precision
    type: bool
  - default: true
    description: Enable verbose logging
    name: verbose
    type: bool
  - default: true
    description: Automatically prepare input for nnUNet
    name: auto_prepare_input
    type: bool
  - default: null
    description: Path to nnUNet results folder
    name: results_folder
    type: str
  required_parameters:
  - default: null
    description: Path to input image file or directory
    name: image_path
    type: str
  - default: null
    description: Directory to save segmentation results
    name: output_dir
    type: str
  - default: null
    description: Task identifier (e.g., 'Task001_BrainTumour')
    name: task_id
    type: str
- description: Create and save visualization of segmentation results using nilearn.
    Generates overlay plots and multiple anatomical views.
  name: create_segmentation_visualization
  optional_parameters:
  - default: ./visualization_output
    description: Directory to save visualization images
    name: output_dir
    type: str
  required_parameters:
  - default: null
    description: Path to original MRI file
    name: original_mri
    type: str
  - default: null
    description: Path to segmentation file
    name: segmentation
    type: str
- description: Perform rigid image registration between two medical images using SimpleITK.
    Rigid registration handles translation and rotation only, preserving shape and
    size. Includes preprocessing, similarity metrics calculation, and visualization
    generation.
  name: quick_rigid_registration
  optional_parameters:
  - default: mutual_information
    description: 'Similarity metric for registration: ''mutual_information'', ''mean_squares'',
      ''correlation'', or ''normalized_correlation'''
    name: metric
    type: str
  - default: gradient_descent
    description: 'Optimization method: ''gradient_descent'', ''lbfgsb'', ''powell'',
      or ''amoeba'''
    name: optimizer
    type: str
  - default: true
    description: Whether to preprocess images (denoising and normalization)
    name: preprocess
    type: bool
  - default: true
    description: Whether to create visualization plots
    name: create_visualizations
    type: bool
  - default: 0.01
    description: Learning rate for gradient descent optimizer
    name: learning_rate
    type: float
  - default: 100
    description: Maximum number of optimization iterations
    name: number_of_iterations
    type: int
  - default: 1.0e-06
    description: Convergence tolerance for optimization
    name: gradient_convergence_tolerance
    type: float
  required_parameters:
  - default: null
    description: Path to the reference (fixed) image file (supports .nii, .nii.gz,
      .nrrd, .mha, .mhd formats)
    name: fixed_image_path
    type: str
  - default: null
    description: Path to the image to be registered (moving image)
    name: moving_image_path
    type: str
  - default: null
    description: Directory path to save registration results and outputs
    name: output_dir
    type: str
- description: Perform affine image registration between two medical images using
    SimpleITK. Affine registration handles translation, rotation, scaling, and shearing.
    More flexible than rigid registration but still preserves parallel lines.
  name: quick_affine_registration
  optional_parameters:
  - default: mutual_information
    description: 'Similarity metric for registration: ''mutual_information'', ''mean_squares'',
      ''correlation'', or ''normalized_correlation'''
    name: metric
    type: str
  - default: gradient_descent
    description: 'Optimization method: ''gradient_descent'', ''lbfgsb'', ''powell'',
      or ''amoeba'''
    name: optimizer
    type: str
  - default: true
    description: Whether to preprocess images (denoising and normalization)
    name: preprocess
    type: bool
  - default: true
    description: Whether to create visualization plots
    name: create_visualizations
    type: bool
  - default: 0.01
    description: Learning rate for gradient descent optimizer
    name: learning_rate
    type: float
  - default: 100
    description: Maximum number of optimization iterations
    name: number_of_iterations
    type: int
  - default: 1.0e-06
    description: Convergence tolerance for optimization
    name: gradient_convergence_tolerance
    type: float
  required_parameters:
  - default: null
    description: Path to the reference (fixed) image file (supports .nii, .nii.gz,
      .nrrd, .mha, .mhd formats)
    name: fixed_image_path
    type: str
  - default: null
    description: Path to the image to be registered (moving image)
    name: moving_image_path
    type: str
  - default: null
    description: Directory path to save registration results and outputs
    name: output_dir
    type: str
- description: Perform deformable (B-spline) image registration between two medical
    images using SimpleITK. Deformable registration allows for local non-linear transformations,
    handling complex deformations. Most flexible but computationally intensive registration
    method.
  name: quick_deformable_registration
  optional_parameters:
  - default: mutual_information
    description: 'Similarity metric for registration: ''mutual_information'', ''mean_squares'',
      ''correlation'', or ''normalized_correlation'''
    name: metric
    type: str
  - default: gradient_descent
    description: 'Optimization method: ''gradient_descent'', ''lbfgsb'', ''powell'',
      or ''amoeba'''
    name: optimizer
    type: str
  - default: true
    description: Whether to preprocess images (denoising and normalization)
    name: preprocess
    type: bool
  - default: true
    description: Whether to create visualization plots
    name: create_visualizations
    type: bool
  - default: 0.01
    description: Learning rate for gradient descent optimizer
    name: learning_rate
    type: float
  - default: 100
    description: Maximum number of optimization iterations
    name: number_of_iterations
    type: int
  - default: 1.0e-06
    description: Convergence tolerance for optimization
    name: gradient_convergence_tolerance
    type: float
  - default: 4
    description: Number of B-spline control points per dimension for deformable registration
    name: number_of_control_points
    type: int
  required_parameters:
  - default: null
    description: Path to the reference (fixed) image file (supports .nii, .nii.gz,
      .nrrd, .mha, .mhd formats)
    name: fixed_image_path
    type: str
  - default: null
    description: Path to the image to be registered (moving image)
    name: moving_image_path
    type: str
  - default: null
    description: Directory path to save registration results and outputs
    name: output_dir
    type: str
- description: Perform batch registration of multiple images to a single reference
    image. Automatically processes all medical image files in a directory and registers
    them to the fixed reference. Supports rigid, affine, or deformable registration
    for all images.
  name: batch_register_images
  optional_parameters:
  - default: rigid
    description: 'Type of registration to perform: ''rigid'', ''affine'', or ''deformable'''
    name: transform_type
    type: str
  - default: mutual_information
    description: 'Similarity metric for registration: ''mutual_information'', ''mean_squares'',
      ''correlation'', or ''normalized_correlation'''
    name: metric
    type: str
  - default: gradient_descent
    description: 'Optimization method: ''gradient_descent'', ''lbfgsb'', ''powell'',
      or ''amoeba'''
    name: optimizer
    type: str
  - default: true
    description: Whether to preprocess images (denoising and normalization)
    name: preprocess
    type: bool
  - default: true
    description: Whether to create visualization plots for each registration
    name: create_visualizations
    type: bool
  - default: 0.01
    description: Learning rate for gradient descent optimizer
    name: learning_rate
    type: float
  - default: 100
    description: Maximum number of optimization iterations
    name: number_of_iterations
    type: int
  - default: 1.0e-06
    description: Convergence tolerance for optimization
    name: gradient_convergence_tolerance
    type: float
  required_parameters:
  - default: null
    description: Path to the reference (fixed) image file
    name: fixed_image_path
    type: str
  - default: null
    description: Directory path containing multiple images to register (supports .nii,
      .nii.gz, .nrrd, .mha, .mhd formats)
    name: moving_images_dir
    type: str
  - default: null
    description: Directory path to save registration results for all images
    name: output_dir
    type: str
- description: Calculate similarity metrics between two medical images. Supports mutual
    information, mean squared error, correlation, and normalized cross correlation.
  name: calculate_similarity_metrics
  required_parameters:
  - default: null
    description: Path to the first image file
    name: image1_path
    type: str
  - default: null
    description: Path to the second image file
    name: image2_path
    type: str
- description: Create visualization plots for registration results. Generates comparison
    plots, difference images, overlays, and metric charts.
  name: create_registration_visualization
  optional_parameters:
  - default: registration
    description: Prefix for output files
    name: prefix
    type: str
  required_parameters:
  - default: null
    description: Path to the reference (fixed) image file
    name: fixed_image_path
    type: str
  - default: null
    description: Path to the original moving image file
    name: moving_image_path
    type: str
  - default: null
    description: Path to the registered image file
    name: registered_image_path
    type: str
  - default: null
    description: Directory to save visualization files
    name: output_dir
    type: str
bioengineering:
- description: Analyze cell migration metrics from time-lapse microscopy images.
  name: analyze_cell_migration_metrics
  optional_parameters:
  - default: 1.0
    description: Conversion factor from pixels to micrometers
    name: pixel_size_um
    type: float
  - default: 1.0
    description: Time interval between consecutive frames in minutes
    name: time_interval_min
    type: float
  - default: 10
    description: Minimum number of frames a cell must be tracked to be included in
      analysis
    name: min_track_length
    type: int
  - default: ./
    description: Directory to save output files
    name: output_dir
    type: str
  required_parameters:
  - default: null
    description: Path to the directory containing time-lapse images or path to a multi-frame
      TIFF file
    name: image_sequence_path
    type: str
- description: Simulates CRISPR-Cas9 genome editing process including guide RNA design,
    delivery, and analysis.
  name: perform_crispr_cas9_genome_editing
  optional_parameters: []
  required_parameters:
  - default: null
    description: List of guide RNA sequences (20 nucleotides each) targeting the genomic
      region of interest
    name: guide_rna_sequences
    type: List[str]
  - default: null
    description: Target genomic sequence to be edited (should be longer than guide
      RNA and contain the target sites)
    name: target_genomic_loci
    type: str
  - default: null
    description: Type of cell or tissue being edited (affects delivery efficiency
      and editing outcomes)
    name: cell_tissue_type
    type: str
- description: Analyze calcium imaging data to quantify neuronal activity metrics
    including cell counts, event rates, decay times, and signal-to-noise ratios.
  name: analyze_calcium_imaging_data
  optional_parameters:
  - default: ./
    description: Directory to save output files
    name: output_dir
    type: str
  required_parameters:
  - default: null
    description: Path to the time-series stack of fluorescence microscopy images (TIFF
      format)
    name: image_stack_path
    type: str
- description: Analyzes in vitro drug release kinetics from biomaterial formulations.
  name: analyze_in_vitro_drug_release_kinetics
  optional_parameters:
  - default: Drug
    description: Name of the drug being analyzed
    name: drug_name
    type: str
  - default: null
    description: Total amount of drug initially loaded in the formulation. If None,
      the maximum concentration is used as 100%
    name: total_drug_loaded
    type: float
  - default: ./
    description: Directory to save output files
    name: output_dir
    type: str
  required_parameters:
  - default: null
    description: Time points at which drug concentrations were measured (in hours)
    name: time_points
    type: List[float] or numpy.ndarray
  - default: null
    description: Measured drug concentration at each time point
    name: concentration_data
    type: List[float] or numpy.ndarray
- description: Quantifies morphological properties of myofibers in microscopy images
    of tissue sections.
  name: analyze_myofiber_morphology
  optional_parameters:
  - default: 2
    description: Channel index containing nuclei staining (DAPI, Hoechst, etc.)
    name: nuclei_channel
    type: int
  - default: 1
    description: Channel index containing myofiber staining (α-Actinin, etc.)
    name: myofiber_channel
    type: int
  - default: otsu
    description: Method for thresholding ('otsu', 'adaptive', or 'manual')
    name: threshold_method
    type: str
  - default: ./
    description: Directory to save output files
    name: output_dir
    type: str
  required_parameters:
  - default: null
    description: Path to the microscopy image file (typically a multichannel image
      with nuclei and myofiber staining)
    name: image_path
    type: str
- description: Model neural activity trajectories and decode behavioral variables.
  name: decode_behavior_from_neural_trajectories
  optional_parameters:
  - default: 10
    description: Number of principal components to use for dimensionality reduction
    name: n_components
    type: int
  - default: ./
    description: Directory to save output files
    name: output_dir
    type: str
  required_parameters:
  - default: null
    description: Neural spiking activity data, shape (n_timepoints, n_neurons)
    name: neural_data
    type: numpy.ndarray
  - default: null
    description: Behavioral data, shape (n_timepoints, n_behavioral_variables)
    name: behavioral_data
    type: numpy.ndarray
- description: Simulate a whole-cell model represented as a system of ordinary differential
    equations (ODEs).
  name: simulate_whole_cell_ode_model
  optional_parameters:
  - default: null
    description: Function defining the system of ODEs. Should take arguments (t, y,
      *args) where t is time, y is the state vector, and args contains additional
      parameters. If None, a simple example whole-cell model will be used.
    name: ode_function
    type: callable
  - default: (0, 100)
    description: Tuple of (start_time, end_time) for the simulation.
    name: time_span
    type: tuple
  - default: 1000
    description: Number of time points to evaluate.
    name: time_points
    type: int
  - default: '''LSODA'''
    description: Numerical integration method to use (e.g., 'RK45', 'LSODA', 'BDF').
    name: method
    type: str
  required_parameters:
  - default: null
    description: Initial values for each state variable in the model. If dict, keys
      are variable names and values are initial concentrations/values. If array-like,
      order must match the order expected by the ODE function.
    name: initial_conditions
    type: dict or array-like
  - default: null
    description: Model parameters required by the ODE function. Keys are parameter
      names and values are parameter values.
    name: parameters
    type: dict
biophysics:
- description: Predicts intrinsically disordered regions (IDRs) in a protein sequence
    using IUPred2A.
  name: predict_protein_disorder_regions
  optional_parameters:
  - default: 0.5
    description: The disorder score threshold above which a residue is considered
      disordered
    name: threshold
    type: float
  - default: disorder_prediction_results.csv
    description: Filename to save the per-residue disorder scores
    name: output_file
    type: str
  required_parameters:
  - default: null
    description: The amino acid sequence of the protein to analyze
    name: protein_sequence
    type: str
- description: Quantifies cell morphology and cytoskeletal organization from fluorescence
    microscopy images.
  name: analyze_cell_morphology_and_cytoskeleton
  optional_parameters:
  - default: ./results
    description: Directory to save output files
    name: output_dir
    type: str
  - default: otsu
    description: Method for cell segmentation ('otsu', 'adaptive', or 'manual')
    name: threshold_method
    type: str
  required_parameters:
  - default: null
    description: Path to the fluorescence microscopy image file
    name: image_path
    type: str
- description: Quantify tissue deformation and flow dynamics from microscopy image
    sequence.
  name: analyze_tissue_deformation_flow
  optional_parameters:
  - default: results
    description: Directory to save results
    name: output_dir
    type: str
  - default: 1.0
